<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self Reflective Code Auditor</title>
    <style>
        /* 1. Futuristic Dark Background */
        body {
            font-family: 'Fira Code', 'Courier New', monospace;
            background: radial-gradient(circle at center, #1e1e2f 0%, #0f0f1a 100%);
            color: #ffffff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 2. Glowing Glass Container */
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 
                        inset 0 0 10px rgba(255, 255, 255, 0.1);
            width: 90%;
            max-width: 800px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 3. Heading Style with Neon Effect */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #00d4ff;
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
            letter-spacing: -1px;
        }

        /* 4. Stylish Code Editor (Textarea) */
        textarea {
            width: 100%;
            height: 300px;
            background: #12121e;
            color: #d1d1d1;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 15px;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            resize: none;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }

        textarea:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }

        /* 5. Animated Analyze Button */
        button {
            margin-top: 25px;
            background: linear-gradient(135deg, #00d4ff 0%, #0072ff 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 114, 255, 0.3);
        }

        button:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 15px 25px rgba(0, 212, 255, 0.5);
        }

        button:active {
            transform: scale(0.98);
        }

        /* 6. Result Area */
        #result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 12px;
            background: rgba(0, 212, 255, 0.05);
            border-left: 4px solid #00d4ff;
            text-align: left;
            min-height: 50px;
            font-size: 15px;
            line-height: 1.6;
        }

        /* Placeholder color */
        textarea::placeholder {
            color: #555;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🔍 Code Auditor <span style="font-weight: 100; opacity: 0.7;">v1.0</span></h1>

    <textarea id="code" placeholder="// Paste your code snippet here to analyze bugs or improvements..."></textarea>

    <button onclick="analyzeCode()">🚀 Analyze Code</button>

    <div id="result">Results will appear here after analysis...</div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
